      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect x="0" y="0" width="1280" height="260" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1280" height="260" fill="#0B1524"/>

  <g mask="url(#m)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
